feed:
  target:
    device:
      integration: zksj_aqua
  fields:
    duration:
      required: true
      example: 600
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
    power:
      example: 0
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

set_program:
  target:
    device:
      integration: zksj_aqua
  fields:
    segments:
      required: true
      example: |
        - type: constant
          start: "00:00:00"
          end: "08:00:00"
          max_power: 40
        - type: gyre
          start: "08:00:00"
          end: "20:00:00"
          min_power: 20
          max_power: 80
          freq: 120
          pwm: 50
      selector:
        object:

sync_time:
  target:
    device:
      integration: zksj_aqua
